<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Shop Admin</h1>
    <div class="row" style="flex:none"><a class="btn secondary" href="/" target="_blank" style="background:transparent;color:var(--text);border-color:var(--border)">View shop</a><button id="logout" class="secondary" hidden>Log out</button></div>
  </header>
  <main>
    <!-- Login -->
    <form id="login" hidden style="max-width:340px;margin:60px auto">
      <h2>Log in</h2>
      <label>Admin password</label>
      <input type="password" name="password" required autofocus>
      <p class="err" id="loginErr"></p>
      <button style="width:100%">Log in</button>
    </form>

    <!-- Dashboard -->
    <div id="dash" hidden>
      <div class="tabs">
        <button data-tab="products">Products</button>
        <button data-tab="orders" class="secondary">Orders</button>
      </div>

      <section id="tab-products">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h2 style="margin:0">Products</h2><button id="newBtn">+ New product</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th></th><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead>
          <tbody id="prodRows"></tbody>
        </table></div>
      </section>

      <section id="tab-orders" hidden>
        <h2>Orders</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
          <tbody id="orderRows"></tbody>
        </table></div>
      </section>
    </div>
  </main>

  <div id="overlay" class="overlay"></div>
  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <form id="editForm" style="padding:24px">
      <h2 id="editTitle" style="margin-top:0">Edit product</h2>
      <div class="row">
        <div><label>Name</label><input name="name" required></div>
        <div style="flex:.5"><label>Price (£)</label><input name="price" type="number" min="0" step="0.01" required></div>
      </div>
      <label>Description</label>
      <textarea name="description" rows="3"></textarea>
      <div class="row">
        <div style="flex:.4"><label>Colour (used when no photo)</label><input name="color" type="color" style="height:42px;padding:4px"></div>
        <div><label>Photo</label><input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></div>
      </div>
      <div id="imgPreview" style="margin-top:8px"></div>
      <label>Stock per size</label>
      <div class="stock-grid" id="stockGrid"></div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" name="visible" style="width:auto"> Visible in shop</label>
      <p class="err" id="editErr"></p>
      <div style="display:flex;gap:8px;justify-content:space-between">
        <button type="button" class="danger" id="deleteBtn">Delete</button>
        <div style="display:flex;gap:8px"><button type="button" class="secondary" id="cancelBtn">Cancel</button><button>Save</button></div>
      </div>
    </form>
  </div>

  <script src="/shared.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let products = [], editing = null, removeImage = false;

    async function init() {
      const { loggedIn } = await api('/api/admin/me');
      $('login').hidden = loggedIn; $('dash').hidden = !loggedIn; $('logout').hidden = !loggedIn;
      if (loggedIn) { loadProducts(); loadOrders(); }
    }

    $('login').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await api('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: e.target.password.value }) });
        e.target.reset(); init();
      } catch (err) { $('loginErr').textContent = err.message; }
    };
    $('logout').onclick = async () => { await api('/api/admin/logout', { method: 'POST' }); init(); };

    document.querySelector('.tabs').onclick = (e) => {
      const t = e.target.dataset.tab; if (!t) return;
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('secondary', b.dataset.tab !== t));
      $('tab-products').hidden = t !== 'products'; $('tab-orders').hidden = t !== 'orders';
      if (t === 'orders') loadOrders();
    };

    async function loadProducts() {
      products = await api('/api/admin/products');
      $('prodRows').innerHTML = products.map((p) => {
        const total = SIZES.reduce((s, k) => s + (p.stock[k] || 0), 0);
        return `<tr>
          <td style="width:56px"><div style="width:44px;border-radius:6px;overflow:hidden">${thumb(p)}</div></td>
          <td>${esc(p.name)}</td><td>${money(p.price)}</td>
          <td title="${SIZES.map((s) => s + ': ' + (p.stock[s] || 0)).join(', ')}">${total}${total === 0 ? ' <span class="muted">(sold out)</span>' : ''}</td>
          <td><span class="badge ${p.visible ? 'on' : ''}">${p.visible ? 'Live' : 'Hidden'}</span></td>
          <td style="text-align:right;white-space:nowrap">
            <button class="secondary" data-toggle="${p.id}">${p.visible ? 'Hide' : 'Show'}</button>
            <button data-edit="${p.id}">Edit</button></td></tr>`;
      }).join('') || '<tr><td colspan="6" class="muted">No products yet.</td></tr>';
    }

    $('prodRows').onclick = async (e) => {
      const { edit, toggle } = e.target.dataset;
      if (edit) openEditor(products.find((p) => p.id === edit));
      if (toggle) {
        const p = products.find((x) => x.id === toggle);
        const fd = new FormData(); fd.append('visible', String(!p.visible));
        await api('/api/admin/products/' + p.id, { method: 'PUT', body: fd }).catch((err) => toast(err.message));
        loadProducts();
      }
    };
    $('newBtn').onclick = () => openEditor(null);

    function openEditor(p) {
      editing = p; removeImage = false;
      const f = $('editForm'); f.reset();
      $('editTitle').textContent = p ? 'Edit product' : 'New product';
      $('deleteBtn').hidden = !p; $('editErr').textContent = '';
      f.name.value = p?.name || ''; f.price.value = p?.price ?? 20; f.description.value = p?.description || '';
      f.color.value = p?.color || '#1f1f1f'; f.visible.checked = p ? p.visible : true;
      $('stockGrid').innerHTML = SIZES.map((s) => `<div>${s}<input type="number" min="0" name="stock_${s}" value="${p?.stock?.[s] ?? 0}"></div>`).join('');
      renderPreview();
      $('modal').classList.add('open'); $('overlay').classList.add('open');
    }
    function renderPreview() {
      const p = editing;
      $('imgPreview').innerHTML = p?.image && !removeImage
        ? `<div style="display:flex;gap:12px;align-items:center"><img src="${esc(p.image)}" style="width:64px;height:64px;object-fit:cover;border-radius:8px"><button type="button" class="secondary" id="rmImg">Remove photo</button></div>` : '';
      const rm = $('rmImg'); if (rm) rm.onclick = () => { removeImage = true; renderPreview(); };
    }

    $('editForm').onsubmit = async (e) => {
      e.preventDefault();
      const f = e.target, fd = new FormData();
      ['name', 'price', 'description', 'color'].forEach((k) => fd.append(k, f[k].value));
      fd.append('visible', String(f.visible.checked));
      fd.append('stock', JSON.stringify(Object.fromEntries(SIZES.map((s) => [s, f['stock_' + s].value]))));
      if (f.image.files[0]) fd.append('image', f.image.files[0]);
      if (removeImage) fd.append('removeImage', 'true');
      try {
        await api('/api/admin/products' + (editing ? '/' + editing.id : ''), { method: editing ? 'PUT' : 'POST', body: fd });
        closeModal(); loadProducts(); toast('Saved');
      } catch (err) { $('editErr').textContent = err.message; }
    };
    $('deleteBtn').onclick = async () => {
      if (!confirm(`Delete "${editing.name}"? This can't be undone.`)) return;
      await api('/api/admin/products/' + editing.id, { method: 'DELETE' });
      closeModal(); loadProducts(); toast('Deleted');
    };
    function closeModal() { $('modal').classList.remove('open'); $('overlay').classList.remove('open'); }
    $('cancelBtn').onclick = closeModal; $('overlay').onclick = closeModal;

    async function loadOrders() {
      const orders = await api('/api/admin/orders');
      $('orderRows').innerHTML = orders.map((o) => `<tr>
        <td>${esc(o.id)}</td><td>${new Date(o.createdAt).toLocaleString()}</td>
        <td>${esc(o.customer.name)}<br><span class="muted">${esc(o.customer.email)}</span></td>
        <td>${o.items.map((i) => `${i.qty}× ${esc(i.name)} (${i.size})`).join('<br>')}</td>
        <td>${money(o.total)}</td>
        <td><select data-order="${esc(o.id)}">${['new', 'paid', 'shipped', 'cancelled'].map((s) => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`
      ).join('') || '<tr><td colspan="6" class="muted">No orders yet.</td></tr>';
    }
    $('orderRows').onchange = async (e) => {
      const id = e.target.dataset.order; if (!id) return;
      await api('/api/admin/orders/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: e.target.value }) });
      toast('Order updated');
    };

    init();
  </script>
</body>
</html>
